[package]
name = "logisim-studio"
version = "0.1.0"
description = "A fast, modern digital circuit editor for macOS"
authors = ["Daniel Wang"]
license = "MIT"
repository = "https://github.com/danielzmeow/Modern-Logisim"
edition = "2021"
rust-version = "1.77"

[lib]
name = "logisim_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
