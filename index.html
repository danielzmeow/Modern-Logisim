<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#eef0f4" />
    <meta
      name="description"
      content="Logisim Studio — a fast, modern digital circuit editor for macOS. Draw, wire and simulate logic circuits locally."
    />
    <title>Logisim Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0d11'/%3E%3Cpath d='M9 11h8a5 5 0 0 1 0 10H9m0-10v10' stroke='%237c8cff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('logisim-studio.prefs.v1') || '{}');
          var appearance = p.appearance === 'light' || p.appearance === 'dark' ? p.appearance : 'system';
          var dark =
            appearance === 'dark' ||
            (appearance === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          var lang = p.lang === 'zh' || p.lang === 'en' ? p.lang : (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.lang = lang;
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b0c10' : '#eef0f4');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
